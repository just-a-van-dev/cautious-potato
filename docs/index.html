<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classes</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="max-w-4xl mx-auto px-4 py-6">

  <div class="mb-6">
    <h1 class="text-5xl font-bold tracking-tight">Classes</h1>
    <p id="updated" class="text-sm text-gray-500 mt-2"></p>
  </div>

  <div class="flex gap-3 mb-8">
    <button id="freeTab" class="px-5 py-2 rounded-full bg-black text-white font-medium">
      Free
    </button>
    <button id="sponsoredTab" class="px-5 py-2 rounded-full bg-white border text-gray-700 font-medium">
      Sponsored / Special
    </button>
  </div>

  <div id="content"></div>
</div>

<script>
let data = null;
let currentTab = "special";
let studioInfo = null

async function loadData() {
  try {
    const response = await fetch("./data.json");

    if (!response.ok) {
      throw new Error(`Failed to load data.json`);
    }

    data = await response.json();

    const resp = await fetch("./studio.json");
    if (!response.ok){
        throw new Error(`Failed to load studio.json`);
    }
    studioInfo = await resp.json();

    document.getElementById("updated").textContent =
      data.last_updated
        ? `Updated ${new Date(data.last_updated).toLocaleString()}`
        : "";

    render();
  } catch (err) {
    console.error(err);

    document.getElementById("content").innerHTML = `
      <div class="bg-red-50 border border-red-200 rounded-xl p-4">
        Unable to load class data.
      </div>
    `;
  }
}

function groupByStudio(classes) {
  return classes.reduce((acc, cls) => {
    (acc[cls.studio] ??= []).push(cls);
    return acc;
  }, {});
}

function isNewClass(cls) {
  return !!cls.isNew;
}

function availabilityBadge(cls) {
  if (cls.available_spot_count === 0) {
    return {
      text: "FULL",
      classes: "bg-red-50 text-red-600"
    };
  }

  if (cls.available_spot_count <= 5) {
    return {
      text: `${cls.available_spot_count} LEFT`,
      classes: "bg-amber-50 text-amber-700"
    };
  }

  return {
    text: `${cls.available_spot_count} SPOTS`,
    classes: "bg-green-50 text-green-700"
  };
}

function formatDate(date, time) {
  const dt = new Date(`${date}T${time}`);
  return dt.toLocaleString("en-CA", {
    weekday: "short",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

function render() {
  const container = document.getElementById("content");
  const grouped = groupByStudio(data[currentTab] || []);

  container.innerHTML = Object.entries(grouped)
    .map(([studio, classes]) => `
      <section class="mb-6">
        <button
          onclick="toggleStudio('${studio.replace(/'/g, "\\'")}')"
          class="w-full flex items-center justify-between mb-3"
        >
          <div class="flex items-center gap-3">
          <img class="h-6" src=${studioInfo[studio].favicon}>
            <h2 class="text-3xl font-semibold">${studio}</h2>

          </div>

          <div class="flex items-center gap-3 text-gray-500">
            <span>${classes.length} classes</span>
            <span id="arrow-${slug(studio)}">▼</span>
          </div>
        </button>

        <div id="${slug(studio)}" class="space-y-3">
          ${classes.map(cls => {
            const badge = availabilityBadge(cls);

            return `
              <div class="bg-white border border-gray-200 rounded-2xl p-5">

                <div class="flex justify-between gap-4">

                  <div class="flex-1">

                    <div class="flex items-center gap-2 mb-2">

                      <div class="text-sm text-gray-500">
                        ${formatDate(cls.start_date, cls.start_time)}
                      </div>

                      ${isNewClass(cls)
                        ? `<span class="px-2 py-1 rounded-full bg-black text-white text-[10px] font-bold">NEW</span>`
                        : ""
                      }

                    </div>

                    <h3 class="text-xl md:text-2xl font-semibold leading-tight">
                      ${cls.name}
                    </h3>

                    <div class="mt-3 text-gray-500">
                      📍 ${cls.location}
                    </div>

                  </div>

                  <div>
                    <span class="px-3 py-2 rounded-xl text-sm font-semibold ${badge.classes}">
                      ${badge.text}
                    </span>
                  </div>

                </div>

              </div>
            `;
          }).join("")}
        </div>
      </section>
    `)
    .join("");
}

function slug(str) {
  return str.replace(/[^a-z0-9]/gi, "-").toLowerCase();
}

function toggleStudio(studio) {
  const id = slug(studio);
  const el = document.getElementById(id);
  const arrow = document.getElementById(`arrow-${id}`);

  if (el.classList.contains("hidden")) {
    el.classList.remove("hidden");
    arrow.textContent = "▼";
  } else {
    el.classList.add("hidden");
    arrow.textContent = "▶";
  }
}

document.getElementById("freeTab").onclick = () => {
  currentTab = "special";
  freeTab.className = "px-5 py-2 rounded-full bg-black text-white font-medium";
  sponsoredTab.className = "px-5 py-2 rounded-full bg-white border text-gray-700 font-medium";
  render();
};

document.getElementById("sponsoredTab").onclick = () => {
  currentTab = "sponsored";
  sponsoredTab.className = "px-5 py-2 rounded-full bg-black text-white font-medium";
  freeTab.className = "px-5 py-2 rounded-full bg-white border text-gray-700 font-medium";
  render();
};

document.getElementById("updated").textContent =
  data && data.last_updated
    ? `Updated ${new Date(data.last_updated).toLocaleString()}`
    : "";

loadData();
</script>
</body>
</html>
